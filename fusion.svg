<circle r="5.5" fill="#34d399"><animateMotion path="M510,170 C590,170 600,90 690,90" dur="2.6s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="1.05s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#34d399"><animateMotion path="M510,170 C590,170 600,90 690,90" dur="2.6s" begin="2.35s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="2.35s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#fbbf24"><animateMotion path="M510,170 C590,170 600,250 690,250" dur="2.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#fbbf24"><animateMotion path="M510,170 C590,170 600,250 690,250" dur="2.6s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="2.7s" repeatCount="indefinite"/></circle>
