<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="MalHate-MM pipeline: text, speech and visuals feed an uncertainty-aware fusion model that either auto-labels or sends the clip to human review" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0720"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
<radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
</defs>
<rect width="900" height="340" rx="18" fill="url(#bg)"/>
<text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3" fill="#a78bfa">HOW MALHATE-MM THINKS</text>
<rect x="40" y="42" width="170" height="56" rx="14" fill="#1e1b4b" stroke="#22d3ee" stroke-width="2"/>
<text x="125" y="67" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="18" fill="#22d3ee">TEXT</text>
<text x="125" y="86" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#c4b5fd">what is said</text>
<path d="M210,70 C320,70 300,170 390,170" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="40" y="142" width="170" height="56" rx="14" fill="#1e1b4b" stroke="#f472b6" stroke-width="2"/>
<text x="125" y="167" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="18" fill="#f472b6">SPEECH</text>
<text x="125" y="186" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#c4b5fd">how it is said</text>
<path d="M210,170 L390,170" fill="none" stroke="#f472b6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="40" y="242" width="170" height="56" rx="14" fill="#1e1b4b" stroke="#a3e635" stroke-width="2"/>
<text x="125" y="267" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="18" fill="#a3e635">VISUALS</text>
<text x="125" y="286" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#c4b5fd">what you see</text>
<path d="M210,270 C320,270 300,170 390,170" fill="none" stroke="#a3e635" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<path d="M510,170 C590,170 600,90 690,90" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>
<path d="M510,170 C590,170 600,250 690,250" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="450" cy="170" r="70" fill="#8b5cf6" opacity="0.18"><animate attributeName="r" values="64;82;64" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="170" r="58" fill="url(#core)" stroke="#ddd6fe" stroke-width="2.5"><animate attributeName="r" values="56;60;56" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="450" y="166" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="800" font-size="17" fill="#fff">FUSION</text>
<text x="450" y="185" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ddd6fe">how sure am I?</text>
<rect x="690" y="60" width="180" height="60" rx="14" fill="#052e22" stroke="#34d399" stroke-width="2"/>
<text x="780" y="86" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="17" fill="#34d399">AUTO LABEL</text>
<text x="780" y="106" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#a7f3d0">confident, so move on</text>
<rect x="690" y="220" width="180" height="60" rx="14" fill="#2b1a05" stroke="#fbbf24" stroke-width="2"/>
<text x="780" y="246" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="17" fill="#fbbf24">HUMAN REVIEW</text>
<text x="780" y="266" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fde68a">not sure, so ask a person</text>
