<circle r="5.5" fill="#a3e635"><animateMotion path="M210,270 C320,270 300,170 390,170" dur="2.6s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
